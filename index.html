<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ハシワタシ</title>
<meta name="theme-color" content="#8FCBE3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--ink:#22303A;--red:#E5483A;--cream:#FFFDF6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"],:root:not([data-theme="light"]){--ink:#22303A}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#8FCBE3}
body{font-family:'Zen Maru Gothic',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);text-align:center;pointer-events:none}
#score{font-family:'Dela Gothic One','Zen Maru Gothic',sans-serif;font-size:56px;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(34,48,58,.25)}
#best{margin-top:6px;font-size:13px;font-weight:700;color:rgba(34,48,58,.6)}
#hint{position:fixed;left:0;right:0;top:34%;text-align:center;font-weight:700;font-size:17px;color:var(--ink);pointer-events:none;transition:opacity .3s}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:rgba(34,48,58,.28)}
.ov[hidden]{display:none}
.card{width:min(340px,100%);background:var(--cream);border-radius:22px;padding:28px 24px 22px;text-align:center;box-shadow:0 18px 50px rgba(20,30,40,.25);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h1{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:38px;margin:0 0 4px;letter-spacing:.02em}
.card h1.out{color:var(--red);font-size:52px}
.card p{margin:8px 0 0;line-height:1.7;font-size:15px}
.rules{text-align:left;margin:16px 0 4px;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.big{font-family:'Dela Gothic One',sans-serif;font-size:64px;line-height:1.1;margin-top:6px}
.go{display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:var(--red);color:#fff;font:700 17px 'Zen Maru Gothic',sans-serif;cursor:pointer;box-shadow:0 4px 0 #B3342A}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #B3342A}
.new{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:#FFD54A;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="ゲーム画面"></canvas>
<div class="hud"><div id="score">0</div><div id="best"></div></div>
<div id="hint">画面を長押しして、橋をのばそう</div>

<div class="ov" id="startOv">
  <div class="card">
    <h1>ハシワタシ</h1>
    <p>車を次の岸へ。いくつ先まで行けるかな？</p>
    <ul class="rules">
      <li><b>1</b><span>画面を長押しすると、橋がのびる</span></li>
      <li><b>2</b><span>離すと橋が止まって、前に倒れる</span></li>
      <li><b>3</b><span>短すぎても、長すぎて次の岸からはみ出してもOUT</span></li>
      <li><b>4</b><span>先に進むほど、岸の幅がせまくなる</span></li>
    </ul>
    <button class="go" id="startBtn">スタート</button>
  </div>
</div>
<div class="ov" id="overOv" hidden>
  <div class="card">
    <h1 class="out">OUT!</h1>
    <p>わたった岸の数</p>
    <div class="big" id="final">0</div>
    <div id="newBest" class="new" hidden>ベスト更新！</div>
    <p id="bestLine"></p>
    <button class="go" id="againBtn">もう一回</button>
  </div>
</div>

<script>
(function(){
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,dpr=1,GY=0,WY=0;
var CW=46,CH=26;                      // car size
var GROW=300, WALK=250;               // px/s
var pillars,cur,bridges,bridge,car,cam,camFrom,camTo,camT,state,score,best=0,parts,clouds,lastT=0,stateT=0;
try{ best=Number(localStorage.getItem('hashiwatashi.best'))||0; }catch(e){}
var $=function(id){return document.getElementById(id);};

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3); W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  GY=Math.round(H*0.64); WY=Math.round(H*0.84);
}
function rand(a,b){ return a+Math.random()*(b-a); }
function nextPillar(prev){
  var maxW=Math.max(24,Math.min(120,W*0.3)-score*3.2), minW=Math.max(16,Math.min(56,W*0.14)-score*1.6);
  var w=rand(minW,maxW);
  var room=W*0.74-w-16, gap=rand(Math.min(48,room),Math.max(60,room));
  return {x:prev.x+prev.w+gap,w:w};
}
function reset(){
  score=0; bridges=[]; parts=[];
  var startW=Math.round(W*0.24);
  pillars=[{x:-W,w:W+startW}]; pillars.push(nextPillar(pillars[0])); pillars.push(nextPillar(pillars[1]));
  cur=0; cam=0; bridge=null;
  car={x:pillars[0].x+pillars[0].w-CW-8,y:0,vy:0,rot:0,wheel:0,target:0,falling:false};
  clouds=[]; for(var i=0;i<6;i++) clouds.push({x:rand(0,W*2),y:rand(H*0.08,H*0.4),s:rand(.6,1.3)});
  setScore(); state='idle';
}
function setScore(){ $('score').textContent=score; $('best').textContent=best?'ベスト '+best:''; }

/* ---- input ---- */
function down(e){ if(e.target.closest&&e.target.closest('.ov')) return; if(state!=='idle') return; e.preventDefault();
  var base=pillars[cur].x+pillars[cur].w; bridge={x:base,len:0,ang:0,drop:false}; state='grow'; $('hint').style.opacity=0; }
function up(){ if(state!=='grow') return; state='fall'; stateT=0; }
window.addEventListener('pointerdown',down,{passive:false});
window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
document.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---- update ---- */
function update(dt){
  stateT+=dt;
  clouds.forEach(function(c){ c.x-=dt*6*c.s; if(c.x-cam*0.15<-160) c.x+=W+320; });
  if(state==='grow'){ bridge.len=Math.min(bridge.len+GROW*dt,W*1.1); }
  else if(state==='fall'){
    var t=Math.min(1,stateT/0.38); bridge.ang=Math.PI/2*t*t;
    if(t>=1){
      var end=bridge.x+bridge.len, nx=pillars[cur+1];
      var ok=end>=nx.x && end<=nx.x+nx.w;
      car.ok=ok; car.target=ok?nx.x+nx.w-CW-8:end-CW*0.35;
      if(!ok && end<nx.x) bridge.drop=true;          // too short: bridge will droop
      state='walk'; stateT=0;
    }
  }
  else if(state==='walk'){
    var step=WALK*dt; car.x=Math.min(car.target,car.x+step); car.wheel+=step/6;
    if(car.x>=car.target){
      if(car.ok){ score++; setScore(); bridges.push(bridge); bridge=null; cur++; pillars.push(nextPillar(pillars[pillars.length-1]));
        camFrom=cam; camTo=pillars[cur].x+pillars[cur].w-W*0.24; state='scroll'; stateT=0; }
      else { car.falling=true; car.vy=-60; state='drop'; stateT=0; }
    }
  }
  else if(state==='scroll'){
    var u=Math.min(1,stateT/0.4), e=1-Math.pow(1-u,3); cam=camFrom+(camTo-camFrom)*e;
    if(u>=1){ state='idle'; if(cur>2){ pillars.splice(0,1); cur--; } if(bridges.length>4) bridges.shift(); }
  }
  else if(state==='drop'){
    if(bridge.drop) bridge.ang=Math.min(Math.PI,bridge.ang+dt*5);
    car.vy+=1900*dt; car.y+=car.vy*dt; car.x+=60*dt; car.rot+=dt*2.6;
    if(!car.splashed && GY+car.y>WY){ car.splashed=true; for(var i=0;i<26;i++) parts.push({x:car.x+CW/2,y:WY,vx:rand(-160,160),vy:rand(-420,-120),r:rand(2,5),life:1}); }
    if(stateT>1.2){ state='over'; gameOver(); }
  }
  parts.forEach(function(p){ p.vy+=1200*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.4; });
  parts=parts.filter(function(p){return p.life>0;});
}

/* ---- draw ---- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBridge(b){
  ctx.save(); ctx.translate(b.x-cam,GY); ctx.rotate(-Math.PI/2+b.ang);
  ctx.fillStyle='#7A5233'; ctx.fillRect(0,-5,b.len,6);
  ctx.fillStyle='#A06F45'; for(var i=4;i<b.len-2;i+=9) ctx.fillRect(i,-5,4,6);
  ctx.restore();
}
function drawCar(){
  var x=car.x-cam, y=GY-CH-4+car.y, bob=(state==='walk')?Math.sin(car.wheel*1.3)*0.8:0;
  ctx.save(); ctx.translate(x+CW/2,y+CH/2+bob); ctx.rotate(car.rot); ctx.translate(-CW/2,-CH/2);
  ctx.fillStyle='rgba(0,0,0,.12)'; if(!car.falling){ ctx.beginPath(); ctx.ellipse(CW/2,CH+4,CW*0.5,3,0,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#E5483A'; rr(0,9,CW,13,5); ctx.fill();          // body
  ctx.fillStyle='#E5483A'; rr(9,0,CW-20,13,5); ctx.fill();       // cabin
  ctx.fillStyle='#CFEFFF'; rr(12,3,9,7,2); ctx.fill(); rr(24,3,CW-36,7,2); ctx.fill();
  ctx.fillStyle='#FFE27A'; ctx.fillRect(CW-4,12,4,4);            // headlight
  ctx.fillStyle='#B3342A'; ctx.fillRect(0,16,CW,2);
  [[11,22],[CW-11,22]].forEach(function(w){
    ctx.save(); ctx.translate(w[0],w[1]); ctx.rotate(car.wheel);
    ctx.fillStyle='#22303A'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#C9D3DA'; ctx.fillRect(-1,-4,2,8); ctx.beginPath(); ctx.arc(0,0,2.2,0,Math.PI*2); ctx.fill(); ctx.restore();
  });
  ctx.restore();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,WY); g.addColorStop(0,'#8FCBE3'); g.addColorStop(1,'#E9F5F2');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,236,170,.9)'; ctx.beginPath(); ctx.arc(W*0.8,H*0.16,Math.min(W,H)*0.07,0,Math.PI*2); ctx.fill();
  // clouds
  ctx.fillStyle='rgba(255,255,255,.85)';
  clouds.forEach(function(c){ var x=((c.x-cam*0.15)%(W+320)+(W+320))%(W+320)-160, s=c.s;
    ctx.beginPath(); ctx.arc(x,c.y,18*s,0,Math.PI*2); ctx.arc(x+20*s,c.y-8*s,22*s,0,Math.PI*2); ctx.arc(x+44*s,c.y,16*s,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+22*s,c.y+6*s,30*s,11*s,0,0,Math.PI*2); ctx.fill(); });
  // far hills
  ctx.fillStyle='#A9D7C4'; ctx.beginPath(); ctx.moveTo(0,WY);
  for(var x=0;x<=W+20;x+=20){ var wx=x+cam*0.3; ctx.lineTo(x,WY-60-Math.sin(wx*0.008)*28-Math.sin(wx*0.021)*12); }
  ctx.lineTo(W,WY); ctx.fill();
  // water
  ctx.fillStyle='#3E8FB8'; ctx.fillRect(0,WY,W,H-WY);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
  var tt=performance.now()/1000;
  for(var r=0;r<3;r++){ ctx.beginPath(); var yy=WY+14+r*22;
    for(var x2=-20;x2<=W+20;x2+=24){ var wx2=x2+cam*0.6+tt*20*(r%2?1:-1); ctx.moveTo(x2,yy+Math.sin(wx2*0.05)*2); ctx.lineTo(x2+12,yy+Math.sin((wx2+12)*0.05)*2); } ctx.stroke(); }
  // pillars (cliffs)
  pillars.forEach(function(p,i){ var x=p.x-cam; if(x>W+10||x+p.w<-10) return;
    ctx.fillStyle='#5B4A3E'; ctx.fillRect(x,GY,p.w,H-GY);
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(x+p.w-6,GY,6,H-GY);
    ctx.fillStyle='#6E9F3C'; ctx.fillRect(x,GY,p.w,9);
    ctx.fillStyle='#86B94A'; ctx.fillRect(x,GY,p.w,4);
    if(i===0 && cam<5){ ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='700 14px "Zen Maru Gothic",sans-serif'; ctx.textAlign='left'; ctx.fillText('スタート地点',Math.max(12,x+p.w-110),GY+36); }
  });
  bridges.forEach(drawBridge); if(bridge) drawBridge(bridge);
  drawCar();
  parts.forEach(function(p){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='#DFF3FB'; ctx.beginPath(); ctx.arc(p.x-cam,p.y,p.r,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1;
}
function loop(t){ var dt=Math.min(0.04,(t-lastT)/1000||0); lastT=t; update(dt); draw(); requestAnimationFrame(loop); }

/* ---- screens ---- */
function gameOver(){
  var nb=score>best; if(nb){ best=score; try{ localStorage.setItem('hashiwatashi.best',best); }catch(e){} }
  $('final').textContent=score; $('newBest').hidden=!nb; $('bestLine').textContent='ベスト '+best; setScore();
  setTimeout(function(){ $('overOv').hidden=false; },150);
}
function start(){ $('startOv').hidden=true; $('overOv').hidden=true; reset(); $('hint').style.opacity=1; }
$('startBtn').addEventListener('click',start); $('againBtn').addEventListener('click',start);
window.addEventListener('resize',function(){ resize(); if(state==='idle'&&score===0) reset(); });
resize(); reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
